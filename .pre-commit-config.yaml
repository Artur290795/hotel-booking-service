repos:
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.16.6
      hooks:
        - id: ruff-check
        - id: ruff-format
    - repo: local
      hooks:
        - id: tests
          name: Run tests
          entry: poetry run pytest
          language: system
          pass_filenames: false


